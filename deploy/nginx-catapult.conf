# nginx site for the Catapult Challenge tool on a Raspberry Pi.
# Install: sudo cp deploy/nginx-catapult.conf /etc/nginx/sites-available/catapult
#          sudo ln -sf /etc/nginx/sites-available/catapult /etc/nginx/sites-enabled/default
#          sudo nginx -t && sudo systemctl reload nginx
# The students' tool is static files only; all computation happens in the browser.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/catapult/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Short cache so config.js edits reach students on reload, but files are
    # not re-downloaded by 30 devices on every page view.
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=60";
    }

    # Tests are for developers, not for the lesson.
    location /tests/ {
        return 404;
    }
}
